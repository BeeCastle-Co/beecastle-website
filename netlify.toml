# Astro builds the whole site into dist/. Only public/ plus rendered pages are
# published, so nothing else in the repo can leak onto the site.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  # Astro 7 requires Node 22.12 or newer.
  NODE_VERSION = "24"
  # pnpm-lock.yaml is the only lockfile: do not add package-lock.json.
  PNPM_FLAGS = "--frozen-lockfile"
  # PUBLIC_-prefixed values are public by definition and belong in the HTML.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_GA_ID,PUBLIC_GOOGLE_SITE_VERIFICATION,PUBLIC_APP_URL,PUBLIC_HELP_URL"

# Keep previews and branch deploys out of search results. The canonical URL is
# handled in astro.config.mjs from Netlify's CONTEXT and DEPLOY_PRIME_URL.
[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex"

# Astro emits sitemap-index.xml; people and tools try /sitemap.xml first.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# The old Hugo site published its feed at /index.xml.
[[redirects]]
  from = "/index.xml"
  to = "/rss.xml"
  status = 301
  force = true

# ------------------------------------------------------------------
# Redirects from the old Hugo site.
#
# Every page in the old sitemap is still published at the same address, so
# only what changed is listed here. Checked against every internal link on
# the old site (docs/private/migration.md has the audit).
#
# 301 = moved for good. 302 = hidden for now and may come back, so search
# engines keep the old address. Netlify matches with or without the trailing
# slash, and rules only fire when no published page exists at the address.
# ------------------------------------------------------------------

# The old categories index, and two posts whose slugs contained "...".
[[redirects]]
  from = "/categories/"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/in-case-you-missed-it...beecastle-product-updates-april-may-2021/"
  to = "/blog/in-case-you-missed-it-beecastle-product-updates-april-may-2021/"
  status = 301

[[redirects]]
  from = "/blog/in-case-you-missed-it...beecastle-product-updates-february-2021/"
  to = "/blog/in-case-you-missed-it-beecastle-product-updates-february-2021/"
  status = 301

# RSS. The old site had a feed per section; the new one has a single feed.
# These come before the pagination rules, which would otherwise catch them.
[[redirects]]
  from = "/blog/index.xml"
  to = "/rss.xml"
  status = 301

[[redirects]]
  from = "/categories/index.xml"
  to = "/rss.xml"
  status = 301

[[redirects]]
  from = "/categories/:category/index.xml"
  to = "/rss.xml"
  status = 301

# Paginated listings. The new blog and category pages show every post on one
# page, so /blog/2/ to /blog/13/ and /categories/<name>/2/ onwards go to the
# first page. Only numbered pages match: real posts are published files.
[[redirects]]
  from = "/blog/:page/"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/categories/:category/:page/"
  to = "/categories/:category/"
  status = 301

[[redirects]]
  from = "/images/favicon.ico"
  to = "/favicon.ico"
  status = 301

# Hidden for now. The source is kept (files prefixed with _ in src/pages, or
