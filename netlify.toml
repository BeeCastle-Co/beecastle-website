# Security headers.
#
# 'unsafe-inline' is needed for scripts: Astro leaves is:inline scripts in the
# HTML and a static site has no server to mint a nonce. What the policy does
# buy is a fixed list of places a script, frame or beacon may come from:
#   googletagmanager, google-analytics         Google Analytics 4 (gtag.js)
#   youtube-nocookie                           video embeds in blog posts
#   app.netlify.com                            deploy-preview feedback drawer
#   suite.beecastle.com                        the sign-up form's action (PUBLIC_APP_URL)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = """\
      default-src 'self'; \
      base-uri 'self'; \
      object-src 'none'; \
      frame-ancestors 'self'; \
      form-action 'self' https://suite.beecastle.com; \
      script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data: blob: https://i.ytimg.com https://*.google-analytics.com https://*.googletagmanager.com; \
      font-src 'self'; \
      media-src 'self'; \
      connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.google.com; \
      frame-src 'self' https://www.youtube-nocookie.com https://app.netlify.com; \
      upgrade-insecure-requests"""

# Hashed build assets never change, so cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
