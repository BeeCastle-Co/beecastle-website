# US English overlay. Only the keys whose wording differs from en-AU.yml go
# here, at the same path; everything else falls back to en-AU. Spelling alone
# (optimise, colour) is not a reason to add a key: the spelling map below
# fixes that across the page, Markdown content included.
#
# A key here that does not exist in en-AU.yml fails the build.

signup:
  microsoftIntro: "Sign up for BeeCastle with your Microsoft account:"
  emailLabel: Sign up with your work email address

# Whole-word AU to US spellings, applied on the page for US visitors to the
# text in the header, main content and footer (not code, form fields, URLs or
# anything marked data-no-i18n). Written in lower case; Title Case and UPPER
# CASE are matched and kept. Keep it conservative: a word that is also a
# correct US word in another sense (licence is only listed as the noun,
# analyses is left out because it is also the plural of analysis) must not be
# here.
