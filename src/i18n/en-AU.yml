home:
  hero:
    steps:
      retention: Retention
      sales: Sales
      reporting: Reporting
    title: The customer success platform [[for MSPs]]
    lede: >-
      BeeCastle helps you optimise your customers' experience using AI-driven
      insights uncovered from your PSA and M365 data. It recommends actions
      that drive results, and empowers everyone in your team to improve
      retention and win upsell and cross-sell opportunities with our
      whitespace technology.
    connects: Connects to ConnectWise, Autotask and HaloPSA in about ten minutes.
  customers:
    heading: More and more technology companies trust BeeCastle to retain customers, reduce churn and supercharge their growth
    logosAlt: Logos of MSPs using BeeCastle, including Control Networks, Rapid Circle, Belton, AfterDark, Fuse and Turrito
  tools:
    label: Products
    heading: The account [[growth tools]] every MSP needs
    lede: BeeCastle can turn any account manager into a data-driven super-closer, with these tools at their fingertips.
    whitespace:
      name: Whitespace & prospecting
      blurb: Find the gaps in your service and product penetration across all accounts.
    revenue:
      name: Revenue tracking dashboards
      blurb: Ready-made dashboards and reporting to visualise, analyse and take action.
    tiering:
      name: Customer tiering
      blurb: Be more intentional about how you nurture accounts through revenue contribution tiering.
    crm:
      name: Automated CRM logging
      blurb: Ditch manual logging. Automatically record activities from M365 and Teams into your CRM.
  testimonials:
    label: Customers
    heading: We get a [[buzz]] out of accurate reporting
    lede: Join thousands of users across seven countries who trust BeeCastle to report accurately on their accounts and find new whitespace to grow revenue.
  howItWorks:
    label: How it works
    heading: Up and running before your [[coffee]] goes cold
    step: STEP {n}
    steps:
      account:
        title: Create an account
        body: Create a **free account** on BeeCastle.
      data:
        title: Connect your data
        body: Connect your **ConnectWise, Autotask or HaloPSA** instance as a source of contacts and information for BeeCastle to review.
      m365:
        title: Connect your M365
        body: Connect your **Microsoft 365** account (email and calendar) to automate data input.
      done:
        title: That's it!
        body: Start reviewing your business metrics, grow sales and drive profitability.
  integrations:
    label: Integrations
    heading: Leverage the data in your stack without [[breaking a sweat]]
    question: Have a lot of data, but not a lot of time to invest in understanding it?
    body: >-
      BeeCastle integrates with your key systems to analyse activities,
      customers and revenue, then presents clear actions for you to take.
      Integrations take about ten minutes to set up, and you can do it yourself
      or get a hand from us. Data syncs in real time, so everything stays up to
      date.
    cta: Connect your PSA
    stackAlt: BeeCastle connects with ConnectWise, Microsoft, Datto, HaloPSA and HubSpot
  roi:
    label: ROI calculator
    heading: Calculate the [[value]] BeeCastle can bring to your MSP
    lede: See how much time your account managers can save, and how much revenue they can generate, with BeeCastle.
    cta: Open the calculator
  plans:
    label: Pricing
    heading: Plans to suit [[every MSP]]
    lede: Whether you're a founder who sells, or an MSP with fully fledged sales and account management teams, there's a BeeCastle plan to suit your business.
  signup:
    label: Get started
    heading: Join [[BeeCastle]]
    lede: Create a free trial account today. No credit card needed.
  story:
    label: Our story
    heading: We believe customer success is [[science]], not serendipity
    lede: >-
      Our systems, algorithms, analytics and platforms are rooted in the belief
      that anyone can have great relationships by following key rules of
      engagement, with a little help from BeeCastle.
    cta: Read our story
    equationAlt: Bee equals data plus relationships
  latestPosts:
    label: From the blog
    heading: Ideas for [[growing]] MSPs
  closing:
    heading: Ready to see what BeeCastle can do for [[your MSP?]]
    lede: Connect your PSA in about ten minutes and see your accounts, revenue and whitespace the same day.
