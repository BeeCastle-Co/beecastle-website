# Every UI string on the site, in English (Australia). This file is the
# primary copy and also serves British English. en-US.yml overrides only the
# keys whose wording differs; anything it leaves out falls back to here.
#
# Read with t('section.key') from src/i18n. A key that does not exist fails
# the build, so a typo cannot ship.
#
# {name} is a placeholder filled by t('key', { name }).
# [[words]] in a heading marks the words that get the highlighter swipe.
# **bold** and [links](/x/) work only where the component renders Markdown
# (the keys that already use them).
# Markdown content (src/content/**) is not in here: it stays Markdown and US
# visitors get it through the spelling map in en-US.yml.

